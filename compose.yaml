services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: db
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
    command:
      [
        "python",
        "manage.py",
        "runserver",
        "0.0.0.0:8000",
        "--noreload",
        "--insecure"
      ]
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  telegram_bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
    command: ["python", "manage.py", "telegram_bot"]
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  media:
